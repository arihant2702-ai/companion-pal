<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CompanionPal — 10-Second Video Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF8F5;
      --card-bg: #FFFFFF;
      --text-main: #23201C;
      --text-muted: #5C554E;
      --primary: #184D45;
      --primary-hover: #113832;
      --accent-warm: #D96B43;
      --border: #E8E2D9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .demo-wrapper {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: 26px;
      color: var(--primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #EAF4F2;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
    }

    .video-canvas-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #111;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #E8E2D9;
      color: var(--text-main);
    }
    .btn-secondary:hover {
      background: #DBD3C7;
    }

    .timeline-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 240px;
    }

    .progress-bar-bg {
      flex: 1;
      height: 8px;
      background: #E8E2D9;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-warm);
      transition: width 0.05s linear;
    }

    .time-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      width: 50px;
      text-align: right;
    }

    .scene-indicators {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .scene-pill {
      padding: 10px;
      border-radius: 10px;
      background: #F4EFEA;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
      transition: all 0.3s;
    }

    .scene-pill.active {
      background: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="demo-wrapper">
    <div class="header-bar">
      <div>
        <h1>CompanionPal: 10-Second Project Demo</h1>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">High-Definition 16:9 Showcase of Accessible Senior Care GenAI</p>
      </div>
      <span class="badge">10.0s HD Demo</span>
    </div>

    <div class="video-canvas-container">
      <canvas id="demoCanvas" width="1280" height="720"></canvas>
    </div>

    <div class="scene-indicators">
      <div class="scene-pill" id="pill-0">01. Overview (0–2.5s)</div>
      <div class="scene-pill" id="pill-1">02. Explain This (2.5–5s)</div>
      <div class="scene-pill" id="pill-2">03. Scam Shield (5–7.5s)</div>
      <div class="scene-pill" id="pill-3">04. Accessibility (7.5–10s)</div>
    </div>

    <div class="controls-bar">
      <div class="timeline-container">
        <button id="btnPlay" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span id="playText">Play Demo</span>
        </button>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span class="time-label" id="timeLabel">0.0s</span>
      </div>

      <button id="btnDownload" class="btn btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Download Video (.webm)</span>
      </button>

      <a href="/" class="btn btn-secondary" style="text-decoration: none;">
        <span>← Back to App</span>
      </a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('demoCanvas');
    const ctx = canvas.getContext('2d');
    const btnPlay = document.getElementById('btnPlay');
    const playText = document.getElementById('playText');
    const btnDownload = document.getElementById('btnDownload');
    const progressFill = document.getElementById('progressFill');
    const timeLabel = document.getElementById('timeLabel');
    const pills = [
      document.getElementById('pill-0'),
      document.getElementById('pill-1'),
      document.getElementById('pill-2'),
      document.getElementById('pill-3')
    ];

    const TOTAL_DURATION = 10.0; // exactly 10.0 seconds
    let startTime = null;
    let isPlaying = false;
    let animationFrameId = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // Preload Hero Image
    const heroImg = new Image();
    heroImg.src = '/images/demo_hero.jpg';
    let heroLoaded = false;
    heroImg.onload = () => {
      heroLoaded = true;
      renderFrame(0);
    };

    function updatePills(sceneIdx) {
      pills.forEach((p, idx) => {
        p.classList.toggle('active', idx === sceneIdx);
      });
    }

    function renderFrame(timeSec) {
      const w = 1280;
      const h = 720;
      ctx.clearRect(0, 0, w, h);

      // Scene 1: 0.0s - 2.5s (The Living Room Problem & Product Intro)
      if (timeSec < 2.5) {
        updatePills(0);
        const progress = timeSec / 2.5;

        // Background Warm Hero
        if (heroLoaded) {
          ctx.drawImage(heroImg, 0, 0, w, h);
          // Dark gentle gradient overlay
          const grad = ctx.createLinearGradient(0, 0, w, 0);
          grad.addColorStop(0, 'rgba(24, 77, 69, 0.92)');
          grad.addColorStop(0.55, 'rgba(24, 77, 69, 0.85)');
          grad.addColorStop(1, 'rgba(24, 77, 69, 0.4)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        } else {
          ctx.fillStyle = '#184D45';
          ctx.fillRect(0, 0, w, h);
        }

        // Title Elements
        ctx.fillStyle = '#FAF8F5';
        ctx.font = '800 68px Fraunces, Georgia, serif';
        ctx.fillText('CompanionPal', 80, 240);

        ctx.fillStyle = '#E8C547';
        ctx.font = '700 32px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('Your Caring Daily AI Companion for Seniors', 80, 310);

        // Feature list cards
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.roundRect(80, 370, 720, 180, 16);
        ctx.fill();

        ctx.fillStyle = '#FAF8F5';
        ctx.font = '600 24px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('• Large 56px touch buttons & AAA contrast', 110, 425);
        ctx.fillText('• 100% live Google Gemini with 2-second speed', 110, 470);
        ctx.fillText('• Voice-in dictation & calm read-aloud', 110, 515);

        // Bottom Brand badge
        ctx.fillStyle = '#E8C547';
        ctx.font = '800 20px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('DESIGNED FOR PATIENCE, INDEPENDENCE & WARMTH', 80, 620);
      }

      // Scene 2: 2.5s - 5.0s (Feature 1: Explain This)
      else if (timeSec < 5.0) {
        updatePills(1);
        ctx.fillStyle = '#FAF8F5';
        ctx.fillRect(0, 0, w, h);

        // Header
        ctx.fillStyle = '#184D45';
        ctx.font = '800 48px Fraunces, Georgia, serif';
        ctx.fillText('Feature 1: "Explain This"', 80, 110);
        ctx.fillStyle = '#5C554E';
        ctx.font = '600 24px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('Translates dense legal & medical letters into clear Grade-6 plain English', 80, 155);

        // Two Cards Comparison
        // Card Left: Confusing Notice
        ctx.fillStyle = '#F4EFEA';
        ctx.roundRect(80, 200, 520, 440, 16);
        ctx.fill();
        ctx.strokeStyle = '#E8E2D9';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#8A3B14';
        ctx.font = '800 22px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('CONFUSING MEDICAL NOTICE', 110, 250);

        ctx.fillStyle = '#5C554E';
        ctx.font = '500 18px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('"Pursuant to section 4B statutory stipulations,', 110, 300);
        ctx.fillText('the recipient is hereby requested to remit', 110, 335);
        ctx.fillText('supplemental co-pay within 14 calendar days..."', 110, 370);

        // Card Right: CompanionPal Simple Summary
        ctx.fillStyle = '#FFFFFF';
        ctx.roundRect(640, 200, 560, 440, 16);
        ctx.fill();
        ctx.strokeStyle = '#184D45';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#184D45';
        ctx.font = '800 22px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('COMPANIONPAL EXPLANATION (LIVE STREAMED)', 670, 250);

        ctx.fillStyle = '#23201C';
        ctx.font = '700 20px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('1. What This Says:', 670, 300);
        ctx.font = '500 18px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('The clinic needs a small $20 visit payment.', 700, 335);

        ctx.font = '700 20px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('2. What To Do Next:', 670, 385);
        ctx.font = '500 18px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('Bring $20 or your card to your next appointment.', 700, 420);

        ctx.font = '700 20px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('3. Important Deadline:', 670, 470);
        ctx.font = '500 18px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('Payment due on Friday, April 4th.', 700, 505);

        // Read aloud icon
        ctx.fillStyle = '#184D45';
        ctx.roundRect(670, 550, 190, 50, 10);
        ctx.fill();
        ctx.fillStyle = '#FFF';
        ctx.font = '700 18px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('🔊 Read Aloud', 700, 582);
      }

      // Scene 3: 5.0s - 7.5s (Feature 2: Is This a Scam?)
      else if (timeSec < 7.5) {
        updatePills(2);
        ctx.fillStyle = '#FAF8F5';
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#184D45';
        ctx.font = '800 48px Fraunces, Georgia, serif';
        ctx.fillText('Feature 2: "Is This a Scam?"', 80, 110);
        ctx.fillStyle = '#5C554E';
        ctx.font = '600 24px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('Protecting seniors from phone, SMS, and power-cut fraud', 80, 155);

        // Scam SMS Card
        ctx.fillStyle = '#FFFFFF';
        ctx.roundRect(80, 200, 480, 440, 16);
        ctx.fill();
        ctx.strokeStyle = '#E8E2D9';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#5C554E';
        ctx.font = '800 20px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('SUSPICIOUS SMS RECEIVED', 110, 250);

        ctx.fillStyle = '#23201C';
        ctx.font = '500 19px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('"Electricity power will be cut tonight at', 110, 305);
        ctx.fillText('9:30 PM due to unpaid bill. Call officer', 110, 340);
        ctx.fillText('at 9876543210 immediately to pay."', 110, 375);

        // Verdict Shield Card
        ctx.fillStyle = '#FFF3EE';
        ctx.roundRect(600, 200, 600, 440, 16);
        ctx.fill();
        ctx.strokeStyle = '#D96B43';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Verdict Badge
        ctx.fillStyle = '#A3331D';
        ctx.roundRect(630, 230, 260, 54, 27);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 22px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('⚠ Verdict: Likely Scam', 655, 265);

        ctx.fillStyle = '#23201C';
        ctx.font = '700 20px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('Why this message is dangerous:', 630, 330);

        ctx.font = '500 18px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('• Electricity boards never threaten instant cuts over text.', 650, 370);
        ctx.fillText('• Scammers use personal mobile numbers, not utility systems.', 650, 410);

        ctx.fillStyle = '#184D45';
        ctx.font = '700 20px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('Safe Action Recommended:', 630, 470);
        ctx.font = '500 18px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#23201C';
        ctx.fillText('Delete this text right now. Do not call the number.', 650, 510);
      }

      // Scene 4: 7.5s - 10.0s (Accessibility, Speed & Independence)
      else {
        updatePills(3);
        ctx.fillStyle = '#184D45';
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#E8C547';
        ctx.font = '800 32px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('ACCESSIBLE • FAST • TRUSTWORTHY', w/2, 160);
        ctx.textAlign = 'center';

        ctx.fillStyle = '#FAF8F5';
        ctx.font = '800 64px Fraunces, Georgia, serif';
        ctx.fillText('CompanionPal', w/2, 250);

        ctx.font = '600 28px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('Empowering Seniors with Confidence & Independence', w/2, 320);

        // 3 Feature Badges
        const badges = [
          { title: 'Grade-6 Simple Words', sub: 'Zero confusing jargon' },
          { title: '2-Second AI Speed', sub: 'Live streaming answers' },
          { title: 'A+ Text & Voice', sub: 'Dictate & listen easily' }
        ];

        badges.forEach((b, i) => {
          const bx = 160 + i * 330;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.roundRect(bx, 380, 300, 150, 16);
          ctx.fill();

          ctx.fillStyle = '#E8C547';
          ctx.font = '800 22px "Plus Jakarta Sans", sans-serif';
          ctx.fillText(b.title, bx + 150, 435);

          ctx.fillStyle = '#FAF8F5';
          ctx.font = '500 18px "Plus Jakarta Sans", sans-serif';
          ctx.fillText(b.sub, bx + 150, 480);
        });

        // Footer URL
        ctx.fillStyle = '#FAF8F5';
        ctx.font = '700 22px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('Try CompanionPal: localhost:3000', w/2, 620);
        ctx.textAlign = 'left'; // reset
      }

      // Watermark / Clock
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.roundRect(w - 140, 20, 120, 38, 8);
      ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.font = '700 16px monospace';
      ctx.fillText(`${timeSec.toFixed(1)}s / 10.0s`, w - 130, 45);
    }

    function step(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = (timestamp - startTime) / 1000;

      if (elapsed <= TOTAL_DURATION) {
        renderFrame(elapsed);
        const pct = (elapsed / TOTAL_DURATION) * 100;
        progressFill.style.width = `${pct}%`;
        timeLabel.textContent = `${elapsed.toFixed(1)}s`;
        animationFrameId = requestAnimationFrame(step);
      } else {
        renderFrame(TOTAL_DURATION);
        progressFill.style.width = '100%';
        timeLabel.textContent = '10.0s';
        stopPlayback();
      }
    }

    function startPlayback() {
      isPlaying = true;
      startTime = null;
      playText.textContent = 'Replay';
      animationFrameId = requestAnimationFrame(step);
    }

    function stopPlayback() {
      isPlaying = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      if (isRecording && mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }

    btnPlay.addEventListener('click', () => {
      startPlayback();
    });

    // Recording & Downloading Video
    btnDownload.addEventListener('click', () => {
      btnDownload.disabled = true;
      btnDownload.textContent = 'Recording 10s video...';

      recordedChunks = [];
      const stream = canvas.captureStream(30); // 30 FPS
      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
        ? 'video/webm;codecs=vp9'
        : 'video/webm';

      mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 3000000 });
      isRecording = true;

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        isRecording = false;
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'companion-pal-10s-demo.webm';
        document.body.appendChild(a);
        a.click();
        URL.revokeObjectURL(url);
        a.remove();
        btnDownload.disabled = false;
        btnDownload.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Download Video (.webm)</span>
        `;
      };

      mediaRecorder.start();
      startPlayback();

      // Automatically stop recording at exactly 10.2 seconds
      setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, 10200);
    });

    // Initial render
    renderFrame(0);
  </script>
</body>
</html>
